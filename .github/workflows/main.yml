name: Update VLESS Subscription

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-sub:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir aiohttp

      - name: Run VLESS aggregator and TCP checker
        run: python aggregator.py

      - name: Commit and push updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt sub_base64.txt
          if git diff --staged --quiet; then
            echo "No changes in subscription files."
            exit 0
          fi
          git commit -m "chore: update VLESS subscription [skip ci]"
          git push


          
